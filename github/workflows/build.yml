name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C /tmp
          mv /tmp/sdks-master/* $THEOS/sdks/
          mkdir -p $THEOS/lib
          curl -L -o $THEOS/lib/libsubstrate.dylib https://github.com/theos/lib/raw/master/libsubstrate.dylib
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      - name: Build dylib
        run: make
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: dude-hack-dylib
          path: .theos/obj/**/*.dylib
